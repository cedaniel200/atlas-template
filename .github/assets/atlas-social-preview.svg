    <text x="1129" y="284" text-anchor="start">engineer</text>
    <text x="1078" y="441" text-anchor="start">qa-analyst</text>
    <text x="842" y="441" text-anchor="end">reviewer</text>
    <text x="791" y="284" text-anchor="end">doc-writer</text>
  </g>

  <!-- Texto -->
  <text x="80" y="240" font-size="124" font-weight="800" fill="#FFFFFF" letter-spacing="-3">ATLAS</text>
  <text x="84" y="302" font-size="40" font-weight="600" fill="#F5B544">OpenSpec + Agentes</text>
  <text x="84" y="366" font-size="28" font-weight="400" fill="#A9BCD0">5 agentes de IA con roles y gates,</text>
  <text x="84" y="404" font-size="28" font-weight="400" fill="#A9BCD0">guiados por especificaciones (SDD).</text>

  <!-- Pipeline SDD -->
  <g font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="22" font-weight="600" text-anchor="middle">
    <g fill="#13283D" stroke="#2DD4BF" stroke-width="2">
      <rect x="80" y="470" width="150" height="48" rx="10"/>
      <rect x="260" y="470" width="110" height="48" rx="10"/>
      <rect x="400" y="470" width="120" height="48" rx="10"/>
      <rect x="550" y="470" width="90" height="48" rx="10"/>
      <rect x="670" y="470" width="110" height="48" rx="10"/>
    </g>
    <g fill="#E6F7F4" stroke="none">
