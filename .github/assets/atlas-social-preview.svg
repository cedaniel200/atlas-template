<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ATLAS - OpenSpec + Agentes</title>
  <defs>
    <radialGradient id="glow" cx="960" cy="320" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17406A"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Brújula de agentes -->
  <circle cx="960" cy="320" r="140" fill="none" stroke="#F5B544" stroke-width="6"/>
  <circle cx="960" cy="320" r="106" fill="none" stroke="#3B5873" stroke-width="2" stroke-dasharray="4 10"/>
  <polygon points="960,180 1093.1,276.7 1042.3,433.3 877.7,433.3 826.9,276.7" fill="none" stroke="#3B5873" stroke-width="2"/>
  <polygon points="960,235 980,320 940,320" fill="#F5B544"/>
  <polygon points="960,405 980,320 940,320" fill="#5B7083"/>
  <circle cx="960" cy="320" r="9" fill="#0D1B2A" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Agentes (nodos numerados en el orden del ciclo) -->
  <g fill="#2DD4BF" stroke="#0D1B2A" stroke-width="5">
    <circle cx="960" cy="180" r="21"/>
    <circle cx="1093.1" cy="276.7" r="21"/>
    <circle cx="1042.3" cy="433.3" r="21"/>
    <circle cx="877.7" cy="433.3" r="21"/>
    <circle cx="826.9" cy="276.7" r="21"/>
  </g>
  <g font-size="20" font-weight="800" fill="#0D1B2A" text-anchor="middle">
    <text x="960" y="187">1</text>
    <text x="1093.1" y="283.7">2</text>
    <text x="1042.3" y="440.3">3</text>
    <text x="877.7" y="440.3">4</text>
    <text x="826.9" y="283.7">5</text>
  </g>
  <g font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="22" font-weight="700" fill="#E6F7F4">
