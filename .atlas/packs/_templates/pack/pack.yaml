# Plantilla de pack.
# Copia este directorio con:
#   node .atlas/scripts/crear-pack.mjs --id <id> --description "..."
# Un pack es PROCEDIMIENTO opcional: skills y agentes. Nunca define comandos de stack.
name: {{ID}}
version: 0.1.0
description: "{{DESCRIPTION}}"
requires: []
skills: []
agents: []
notes: |
  Añade las skills en skills/<nombre>/SKILL.md y los agentes en agents/<rol>.md.
  Actívalo en state.stacks[].packs y en state.packs.
