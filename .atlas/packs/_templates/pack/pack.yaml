# Pack template.
# Copy this directory with:
#   node .atlas/scripts/crear-pack.mjs --id <id> --description "..."
# A pack is optional PROCEDURE: skills and agents. It never defines stack commands.
name: {{ID}}
version: 0.1.0
description: "{{DESCRIPTION}}"
requires: []
skills: []
agents: []
notes: |
  Add skills in skills/<name>/SKILL.md and agents in agents/<role>.md.
  Activate it in state.stacks[].packs and state.packs.
