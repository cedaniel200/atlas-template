# Stack profile template.
# Copy this file with:
#   node .atlas/scripts/crear-perfil.mjs --id <id> --language <language>
# Then fill in the commands with real values and validate them by running them.
# A profile is DATA: commands and paths. Do not include procedures or prompts.
name: {{ID}}
description: "{{DESCRIPTION}}"

stack:
  language: "{{LANGUAGE}}"
  runtime: "{{RUNTIME}}"
  package_manager: "{{PACKAGE_MANAGER}}"

structure:
  source: "{{SOURCE}}"
  tests: "{{TESTS}}"

commands:
  install: ""
  build: ""
  run: ""
  test: ""
  test_unit: ""
  lint: ""
  lint_tests: ""
  typecheck: ""
  static_analysis: ""
  quality: ""
  coverage: ""
  mutation: ""
  crap: ""

quality:
  crap_threshold: 6
  coverage_min: null
  tools: []
  suggested: []

qa:
  docker: false
  service_name: ""
  app_port: ""
  health_path: ""
  metrics_path: ""

notes: |
  Commands pending completion and validation by running them.
  If a command does not apply, leave it as "" and explain it here.
