name: node-ts
description: Proyecto Node.js + TypeScript

stack:
  language: TypeScript
  runtime: Node.js
  package_manager: pnpm   # ajusta a npm/yarn si aplica

structure:
  source: src/
  tests: test/

commands:
  install: "pnpm install"
  build: "pnpm build"
  run: "pnpm dev"
  test: "pnpm test"
  test_unit: "pnpm test -- --run"
  lint: "pnpm lint"
  lint_tests: "pnpm lint"
  typecheck: "pnpm typecheck"
  static_analysis: "pnpm lint && pnpm typecheck"
  quality: "pnpm lint && pnpm typecheck && pnpm test"
  coverage: "pnpm test -- --coverage"
  mutation: "npx stryker run"
  crap: "node scripts/crap.mjs"   # requiere el reporte de cobertura

quality:
  crap_threshold: 6
  coverage_min: null
  tools: [eslint, prettier, tsc, vitest, gitleaks]
  suggested: [stryker, dependency-cruiser, semgrep]

qa:
  docker: false
  service_name: null
  app_port: 3000
  health_path: /health
  metrics_path: /metrics

notes: |
  Perfil de ejemplo. Verifica cada comando antes de usarlo en un proyecto real.
  Si el proyecto no tiene script de CRAP, el gate se omite hasta implementarlo.
