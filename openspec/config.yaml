schema: spec-driven-with-adr

context: |
  Proyecto: {{PROJECT_NAME}}
  Descripción: {{ONE_LINE_DESCRIPTION}}
  Stack: {{STACK_SUMMARY}}
  Dominio: {{DOMAIN_SUMMARY}}
  Arquitectura: {{ARCHITECTURE_SUMMARY}}
  Package base: {{PACKAGE_BASE}}
  Idioma de la documentación: {{LANGUAGE_USER}}

# IMPORTANTE: cada regla debe ser un string entre comillas.
# Un ": " sin comillas convierte el ítem en un mapa y OpenSpec descarta TODA la regla
# del artefacto ("must be an array of strings"). Validar con: openspec context
rules:
  proposal:
    - "Máximo 250 palabras"
    - "Incluir una sección de capacidades mapeadas al dominio (agregados, value objects, eventos)"
  specs:
    - "Usar el lenguaje ubicuo definido en AGENTS.md; no introducir sinónimos"
    - "Escenarios GIVEN/WHEN/THEN en lenguaje de negocio, no técnico"
  design:
    - "Alinear con la arquitectura declarada en AGENTS.md"
    - "Respetar las fronteras entre capas: el dominio no depende de la infraestructura"
    - "Incluir diagramas C4 en Mermaid cuando sea relevante (Context → Container → Component)"
  adr:
    - "Registrar solo decisiones durables; no inventar ADRs para detalles tácticos"
    - "Un ADR aceptado es inmutable: para cambiarlo se crea uno nuevo que lo supersede"
  tasks:
    - "Desglosar por capas o módulos según la arquitectura declarada"
    - "Cada tarea debe ser verificable de forma independiente"
