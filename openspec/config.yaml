schema: spec-driven-with-adr

context: |
  Project: {{PROJECT_NAME}}
  Description: {{ONE_LINE_DESCRIPTION}}
  Stack: {{STACK_SUMMARY}}
  Domain: {{DOMAIN_SUMMARY}}
  Architecture: {{ARCHITECTURE_SUMMARY}}
  Base package: {{PACKAGE_BASE}}
  Documentation language: {{LANGUAGE_USER}}

# IMPORTANT: each rule must be a quoted string.
# A ": " without quotes turns the item into a map and OpenSpec discards the WHOLE rule
# of the artifact ("must be an array of strings"). Validate with: openspec context
#
# Rules are architecture-agnostic: the concrete stance (layers, hexagonal, tactical DDD,
# whatever the project already uses) is declared in AGENTS.md § Architecture and the
# bootstrap may adjust these rules to it.
rules:
  proposal:
    - "Maximum 250 words"
    - "Include a capabilities section mapped to the business domain"
  specs:
    - "Use the domain language defined in AGENTS.md; do not introduce synonyms"
    - "GIVEN/WHEN/THEN scenarios in business language, not technical"
  design:
    - "Align with the architecture declared in AGENTS.md"
    - "Respect the boundaries and dependency direction declared by the project"
    - "Include C4 Mermaid diagrams when relevant (Context → Container → Component)"
  adr:
    - "Record only durable decisions; do not invent ADRs for tactical details"
    - "An accepted ADR is immutable: create a new one that supersedes it"
  tasks:
    - "Break down by layers or modules according to the declared architecture"
    - "Each task must be independently verifiable"
